<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Consulte endereços brasileiros pelo CEP de forma rápida e simples."
    />
    <title>BuscaCEP | Consulte seu endereço</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            boxShadow: { soft: "0 20px 50px -20px rgb(15 23 42 / 0.25)" },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col px-4 py-10 sm:px-6 sm:py-16">
      <section class="rounded-3xl bg-white p-6 shadow-soft ring-1 ring-slate-200 transition-colors dark:bg-slate-900 dark:ring-slate-700 sm:p-10" aria-labelledby="page-title">
        <div class="mb-3 flex justify-end">
          <button id="theme-toggle" type="button" class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-slate-300 dark:hover:bg-slate-800" aria-pressed="false">
            <span id="theme-icon" aria-hidden="true">☾</span>
            <span id="theme-label">Modo escuro</span>
          </button>
        </div>
        <div class="mb-8 text-center">
          <div class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-2xl bg-indigo-600 text-xl text-white" aria-hidden="true">⌖</div>
          <h1 id="page-title" class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Buscador de CEP</h1>
          <p class="mt-3 text-slate-500 dark:text-slate-400">Digite um CEP e encontre o endereço em segundos.</p>
        </div>

        <div>
          <label for="cep" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">CEP</label>
          <div class="relative">
            <input
              id="cep"
              name="cep"
              type="text"
              inputmode="numeric"
              autocomplete="postal-code"
              maxlength="9"
              placeholder="00000-000"
              aria-describedby="input-help status-message"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3.5 pr-12 text-lg font-medium tracking-wide outline-none transition placeholder:font-normal placeholder:tracking-normal placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:focus:ring-indigo-950"
            />
            <div id="input-spinner" class="absolute inset-y-0 right-4 hidden items-center" aria-hidden="true">
              <span class="h-5 w-5 animate-spin rounded-full border-2 border-indigo-200 border-t-indigo-600"></span>
            </div>
          </div>
          <p id="input-help" class="mt-2 text-sm text-slate-500 dark:text-slate-400">A busca é feita automaticamente ao completar os 8 dígitos.</p>
          <p id="status-message" class="mt-2 hidden text-sm font-medium" role="status" aria-live="polite"></p>
        </div>

        <section id="result-section" class="mt-8 hidden" aria-labelledby="result-title" aria-live="polite">
          <div class="mb-4 flex items-center justify-between">
            <h2 id="result-title" class="text-lg font-bold text-slate-900 dark:text-white">Endereço encontrado</h2>
            <span id="result-cep" class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-semibold text-indigo-700"></span>
          </div>
          <div class="grid gap-3 sm:grid-cols-2">
            <article class="rounded-xl border border-slate-100 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800 sm:col-span-2">
              <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Rua</p>
              <p id="address-street" class="mt-1 font-medium text-slate-800 dark:text-slate-100">—</p>
            </article>
            <article class="rounded-xl border border-slate-100 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800">
              <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Bairro</p>
              <p id="address-neighborhood" class="mt-1 font-medium text-slate-800 dark:text-slate-100">—</p>
            </article>
            <article class="rounded-xl border border-slate-100 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800">
              <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Cidade / UF</p>
              <p id="address-city" class="mt-1 font-medium text-slate-800 dark:text-slate-100">—</p>
            </article>
          </div>
        </section>

        <section class="mt-10 border-t border-slate-100 pt-7 dark:border-slate-700" aria-labelledby="history-title">
          <div class="flex items-center justify-between gap-4">
            <h2 id="history-title" class="text-lg font-bold text-slate-900 dark:text-white">Pesquisas recentes</h2>
            <button id="clear-history" type="button" class="hidden text-sm font-semibold text-indigo-600 transition hover:text-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Limpar histórico</button>
          </div>
          <p id="empty-history" class="mt-3 text-sm text-slate-500 dark:text-slate-400">Seus últimos CEPs consultados aparecerão aqui.</p>
          <ul id="history-list" class="mt-3 space-y-2" aria-label="Histórico de CEPs"></ul>
        </section>
      </section>
      <p class="mt-6 text-center text-xs text-slate-400 dark:text-slate-500">Dados fornecidos por ViaCEP</p>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
